server.port=${PORT:8080}

# ============================================================
# GAMESHOP BACKEND (Java / Spring Boot)
# ------------------------------------------------------------
# COLOQUE AQUI AS SUAS CHAVES DO SUPABASE para o backend gravar
# pedidos e mensagens diretamente no banco:
#   1. Supabase Dashboard -> Project Settings -> API
#   2. Project URL            -> gameshop.supabase.url
#   3. service_role secret    -> gameshop.supabase.service-key (somente servidor!)
#
# Pode usar variáveis de ambiente (recomendado em produção):
#   SUPABASE_URL e SUPABASE_SERVICE_KEY sobrescrevem os valores abaixo.
#
# Sem essas chaves o backend roda em modo demo e devolve pedidos
# simulados (útil para desenvolvimento de front-end).
# ============================================================
gameshop.supabase.url=${SUPABASE_URL:}
gameshop.supabase.service-key=${SUPABASE_SERVICE_KEY:}

spring.application.name=gameshop-backend
spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.gameshop=INFO
